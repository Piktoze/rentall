name: Isolated browser E2E (staging only)

on:
  push:
    branches: [staging/v203]
    paths:
      - "e2e/**"
      - "server.js"
      - "db.js"
      - "app.js"
      - "config.js"
      - "modules/**"
      - "privacy-requests-http-v255.test.mjs"
      - "rental-http-e2e-v210.test.js"
      - "webhook-signed-http-v231.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/isolated-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    if: github.ref == 'refs/heads/staging/v203'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      PORT: "3000"
      STRIPE_MODE: test
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_CONNECT_WEBHOOK_SECRET: ""
      DATABASE_URL: ""
      RENTINORBIT_DB_PATH: ""
      RAILWAY_VOLUME_MOUNT_PATH: ""
      EMAIL_PROVIDER: disabled
      EMAIL_WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Configure disposable runner storage
        run: |
          echo "DB_PATH=${RUNNER_TEMP}/rentinorbit-ci.sqlite" >> "${GITHUB_ENV}"
          echo "UPLOADS_DIR=${RUNNER_TEMP}/rentinorbit-ci-uploads" >> "${GITHUB_ENV}"
      - name: Verify temporary database
        run: |
          test "${DB_PATH}" = "${RUNNER_TEMP}/rentinorbit-ci.sqlite"
          case "${DB_PATH}" in /data/*) exit 1 ;; esac
          npm run db:init
      - name: Seed synthetic discovery listing in temporary CI database
        run: node e2e/seed-ci-listing.mjs
      - name: Test isolated privacy HTTP authorization and audit
        run: node privacy-requests-http-v255.test.mjs
      - name: Verify full two-account booking lifecycle over real local HTTP
        run: node rental-http-e2e-v210.test.js
      - name: Verify signed Stripe webhook locally (synthetic events only)
        run: node webhook-signed-http-v231.test.js
      - name: Run real Chromium browser E2E, no live services
        # Collect independent browser evidence even if a prior HTTP regression fails.
        # The workflow still fails overall when any critical step fails.
        if: ${{ success() || failure() }}
        run: npx playwright test e2e/isolated-ci.spec.js e2e/customer-journey.spec.js e2e/privacy-requests-v261.spec.js --config=e2e/playwright.config.js
      - name: Probe public staging HTTPS endpoints (read-only evidence)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          const base = 'https://rentall-staging.up.railway.app';
          const paths = ['/healthz', '/api/readiness', '/api/ops/status', '/api/integrations/capabilities', '/api/listings'];
          for (const path of paths) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
              const res = await fetch(base + path, { method: 'GET', redirect: 'error', signal: controller.signal, headers: { 'Accept': 'application/json' } });
              console.log(`STAGING_HTTP ${path} ${res.status} ${res.ok ? 'OK' : 'CHECK'}`);
            } catch (error) {
              console.log(`STAGING_HTTP ${path} UNAVAILABLE ${error.name || 'NetworkError'}`);
            } finally {
              clearTimeout(timeout);
            }
          }
          console.log('Read-only staging probe completed; HTTP results are informational, not Chromium E2E or Stripe charge proof.');
          JS
      - name: Upload browser test evidence after every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-e2e-report
          path: |
            e2e/report/
            e2e/test-results/
            test-results/
          if-no-files-found: warn
          retention-days: 3
