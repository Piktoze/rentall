<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">RentInOrbit horizontal logo</title>
  <desc id="desc">RentInOrbit wordmark with an orbital R symbol</desc>
  <defs>
    <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10C7F4"/>
      <stop offset="43%" stop-color="#0878EF"/>
      <stop offset="72%" stop-color="#153DBB"/>
      <stop offset="100%" stop-color="#6A35EB"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2437C4"/>
      <stop offset="48%" stop-color="#087FEF"/>
      <stop offset="100%" stop-color="#18C8F1"/>
    </linearGradient>
    <linearGradient id="inGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14C6F5"/>
      <stop offset="100%" stop-color="#0877F2"/>
    </linearGradient>
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#20D1F6"/>
      <stop offset="48%" stop-color="#087DF0"/>
      <stop offset="100%" stop-color="#102D93"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0A225A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Orbital R mark -->
  <g transform="translate(40 38)" filter="url(#softShadow)">
    <!-- R body -->
    <path fill="url(#rGrad)" d="
      M135 62
      H285
      C376 62 436 112 436 184
      C436 244 395 286 333 299
      L425 424
      H332
      L252 311
      H210
      V424
      H132
      V253
      C132 221 154 203 187 203
      H280
      C326 203 350 188 350 159
      C350 128 322 116 276 116
      H135
      Z"/>
    <!-- inner navy cut / depth -->
    <path fill="#081A4D" d="
      M177 116
      H276
      C322 116 350 128 350 159
      C350 188 326 203 280 203
      H224
      C198 179 184 150 177 116
      Z"/>
    <!-- orbit -->
    <path d="M39 292
             C87 214 203 174 346 176
             C429 177 486 200 500 231
             C518 271 462 321 366 355
             C244 399 111 399 56 359
             C32 341 27 316 39 292Z"
          fill="none" stroke="url(#orbitGrad)" stroke-width="18" stroke-linecap="round"/>
    <!-- orbit front accent -->
    <path d="M62 346
             C146 381 280 374 389 333
             C448 311 482 285 495 260"
          fill="none" stroke="#12A8F4" stroke-width="8" stroke-linecap="round"/>
    <!-- planet dash + planet -->
    <path d="M365 127 L400 122" stroke="#123AAE" stroke-width="9" stroke-linecap="round"/>
    <circle cx="431" cy="116" r="28" fill="url(#planetGrad)"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="190" font-weight="800" letter-spacing="-9">
    <text x="585" y="335" fill="#06163F">Rent</text>
    <text x="954" y="335" fill="url(#inGrad)">In</text>
    <text x="1135" y="335" fill="#06163F">Orbit</text>
  </g>
</svg>
